# chronyd in the pepin-chrony container (ros/chrony/Dockerfile, started by ros/lib.sh's
# pepin_timeserver_up beside the zenoh router). It serves the Docker VM's clock to the board.
#
# NO SOURCES AND NO CLOCK CONTROL, on purpose. The job is not "what time is it" but "what time do
# the laptop's ROS nodes think it is": the board follows that, and a scan stamped on one machine
# means the same instant on the other. So chronyd runs with -x (the Dockerfile) and no `server`
# line: it never touches the clock and serves the VM's own time as its local reference.
#
# WHY IT DOES NOT DISCIPLINE THE VM CLOCK (no CAP_SYS_TIME), decided on the 2026-09-23 autopsy
# (scratch/link_autopsy/wake_chain.py): the VM's clock stops while the Mac sleeps and restarts
# where it stopped, minutes behind — and Docker Desktop already steps it back to the Mac's clock
# 10-26 s after every wake (measured: +26, +10, +22, +19 s after four wakes). The link and
# RTAB-Map worked through three of those 15-minute-lag windows; what killed the link that day was
# the zenoh session, not the clock. A second agent stepping the one kernel clock every container
# shares would race Docker's own resync and could step every ROS node's time BACKWARDS. The
# window itself is the board's to survive: its chrony votes this server out against the pool
# while it is minutes off (board/chrony/chrony.conf).
local stratum 10

# The board's queries arrive through Docker Desktop's port proxy (-p 123:123/udp), from an address
# on the VM's side, not the board's own: the published port is the only way in, so any is allowed.
allow all

# chronyc over the container's Unix socket only: docker exec pepin-chrony chronyc -n tracking
cmdport 0
