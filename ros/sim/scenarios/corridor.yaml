# Two clean legs in the open middle of the flat: 1.3 m south, then back north (a turn in place
# first), never nearer than 0.55 m to anything in the grid. What a leg costs when nothing is in
# the way — the control for the other scenarios, and the one the clock rates are compared on.
name: corridor
world: flat
start: {x: -0.2, y: 2.5, yaw_deg: -90.0}
legs:
  - {x: 0.0, y: 1.2, yaw_deg: -90.0}
  - {x: -0.2, y: 2.5, yaw_deg: 90.0}
slow_s: 30
timeout_s: 120
