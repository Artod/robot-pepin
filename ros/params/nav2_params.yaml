amcl:
  ros__parameters:
    alpha1: 0.6  # rotation noise from rotation: the wheels over-report turns by 10-25% on carpet
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.4  # rotation noise from translation: one wheel slipping while driving straight
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 1000
    min_particles: 300
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Kidnap recovery off: with this flat's imperfect map it kept injecting random particles
    # and the pose wandered mid-drive. A lifted cart is re-seeded through /initialpose.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.15
    tf_broadcast: false  # the relocalizer's scan-matching tracker owns map -> odom
    transform_tolerance: 0.5  # scans arrive within 0.03 s now; 2.0 let a stale pose pass as current
    update_min_a: 0.05  # correct with the laser every 3 degrees, not every 11
    update_min_d: 0.05  # and every 5 cm, not every 25: the wheels cannot be trusted for 25 cm
    # Sharper beam model than the defaults (z_hit 0.5 / z_rand 0.5): with half the weight on
    # 'random' the likelihood is flat and the pose drifted 0.5 m over a 5 m round trip.
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: /scan
    # the cart starts on the map origin (our --init 0 0 0); Foxglove can re-seed it any time
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: /params/pepin_nav_to_pose.xml  # back up before spinning (see the file)
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # A four-core A53 under Nav2 answers action requests in hundreds of ms, not 20:
    # with the defaults the first goal died with 'Timed out while waiting for action server'.
    bt_loop_duration: 50
    default_server_timeout: 2000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0  # 5 Hz meant 3 cm of blind travel per decision at 0.15 m/s
    costmap_update_timeout: 0.50  # the local costmap updates at 3 Hz
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    # One controller for both planners. A second one wrapped in a RotationShim was added on the
    # premise that RPP cannot both reverse and turn in place; that is false in nav2 1.3.12
    # (shouldRotateToPath adds pi when reversing). The shim then re-aimed the cart at every fresh
    # plan, and with no reversing left in the plans there is nothing for it to do.
    controller_plugins: ["FollowPath", "FollowPathReversing"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      # Pose, not Simple: SimpleProgressChecker measures translation only, so a cart legally
      # pivoting in place is "not making progress" and the goal is aborted mid-turn. That is what
      # happened twice at the base in run 0003 — a 70 degree pivot at 0.5 rad/s on a control loop
      # running at 3-5 Hz took longer than the allowance, and Nav2 answered with a 6 s reverse
      # into the cables. A turn is progress; standing still is not.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.15  # 0.5 aborted every goal closer than half a metre
      required_movement_angle: 0.5  # ...or 29 degrees of turning, which a pivot delivers in a second
      movement_time_allowance: 6.0  # stuck is obvious after six seconds; ten wasted a recovery slot
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.10: tighter than the 0.15 that let a mark be called reached 15 cm short, loose enough
      # that the goal checker can still be satisfied at a path end the planner had to shift.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20  # 0.30 rad swings a front corner 8 cm sideways
    FollowPath:
      # Regulated Pure Pursuit: a fraction of MPPI's CPU on the board's A53 cores, and a
      # differential-drive cart at 0.15 m/s does not need model-predictive sampling.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20
      lookahead_dist: 0.55
      min_lookahead_dist: 0.40
      max_lookahead_dist: 0.60
      lookahead_time: 2.5
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.3  # brake later: the crawl to the goal felt endless
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.7
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_cost_regulated_linear_velocity_scaling: true
      # RPP recomputes the distance to an obstacle from the cost it reads, so these two must
      # match the local costmap's inflation layer exactly; on the defaults (3.0 / 0.6) it was
      # mis-reading its own clearance and crawling near walls for no reason.
      inflation_cost_scaling_factor: 5.0
      cost_scaling_dist: 0.30
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.06
      use_rotate_to_heading: true
      # Pivoting is the expensive move for this cart: base_link sits 0.30 m ahead of the rear
      # corners, so turning in place sweeps 0.407 m while driving an arc sweeps barely more than
      # the hull. RPP forward-simulates a pivot in fixed 7.03 deg steps (2 sin(res/2 / R) / w),
      # so 0.6 rad/s checked 21.1 deg = 0.365 m of clearance and was refused 44 times beside a
      # printer standing 0.35 m away; 0.5 rad/s checks 14.1 deg = 0.340 m. Raising the threshold
      # to 1.2 rad means anything under 69 deg is driven out as an arc instead of pivoted on the
      # spot — which is what a person does in a tight corner.
      rotate_to_heading_min_angle: 1.2
      max_angular_accel: 1.0  # the velocity smoother allows 1.0; a rotation braking against
      max_robot_pose_search_dist: 10.0

    FollowPathReversing:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20
      lookahead_dist: 0.55
      min_lookahead_dist: 0.40
      max_lookahead_dist: 0.60
      lookahead_time: 2.5
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.3  # brake later: the crawl to the goal felt endless
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.7
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 5.0
      cost_scaling_dist: 0.30
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.06
      use_rotate_to_heading: false  # a reversing RPP steers, it does not pivot
      rotate_to_heading_min_angle: 1.2
      max_angular_accel: 1.0  # the velocity smoother allows 1.0; a rotation braking against
      max_robot_pose_search_dist: 10.0
      allow_reversing: true

local_costmap:
  local_costmap:
    ros__parameters:
      # 3 Hz, not 5: raising it did shorten the delay before a ToF return became cost, but it
      # pushed the board's load average from 6.5 to 9.6 and the controller loop is already the
      # thing that starves. The free half of that latency came from mark_threshold instead.
      update_frequency: 3.0
      publish_frequency: 1.0
      transform_tolerance: 0.3  # a sensor stamped 'now' waits at most this long for odom->base_link
      # map, not odom: the progress checker judges movement in this frame, and a wheel slipping on
      # the carpet feeds odom a whole metre of motion while the robot stands still (58 s of
      # spinning with zero failures on 2026-09-06). The scan-matching tracker corrects smoothly
      # at 6-10 Hz, so a map-frame window does not jump the way it would under AMCL.
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      # 0.0, deliberately, and this is what lets the cart touch furniture. Nav2's DEFAULT
      # footprint_padding is 0.01, and it was silently in force: /local_costmap/published_footprint
      # measured 0.5700 x 0.3825 with an inscribed radius of 0.0725 m, i.e. a centimetre of phantom
      # hull in front of a bumper that is only 0.0625 m ahead of base_link. That phantom is the
      # polygon every collision check uses, so a pose with the bumper against a table read as a
      # collision — the timidity was a padding default, not caution.
      footprint_padding: 0.0
      resolution: 0.05
      footprint: "[[0.0625, 0.275], [0.0625, -0.275], [-0.30, -0.275], [-0.30, 0.275]]"
      plugins: ["obstacle_layer", "tof_front_layer", "tof_left_layer", "tof_right_layer", "inflation_layer"]
      # The three VL53L1X at bumper height (tof_bridge -> sensor_msgs/Range): they see the rocking
      # chair's rails, a box on the floor, a carpet roll — everything under the lidar plane.
      # ONE LAYER PER SENSOR, on purpose: a single layer fed by all three shares one probability
      # grid, so the front sensor — which reported "nothing" in 801 of 802 frames on 2026-09-08 —
      # cleared the marks the side sensors had just written wherever the cones overlap (from
      # 0.62 m out). Separate layers cannot erase each other's evidence.
      tof_front_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/tof/front"]
        # The VL53L1X cone really is 0.47 rad (27 deg). At 1.2 the layer painted a 69 deg arc,
        # so one chair leg at 0.5 m became a 0.6 m wall — the ToF layer's own version of a
        # costmap that is too puffy. Model the sensor, then let the inflation layer do inflation.
        phi: 0.47
        # The whole cone: the sensor cannot say where across its 27 degrees the object was, so the
        # honest mark is the whole arc at that range (0.19 m wide at 0.4 m, about four cells).
        inflate_cone: 1.0
        # 0 = never declare the costmap stale because of the ToF: the layer's 'current' flag stayed
        # false after one timeout (the boot-time clock jump) and every goal died instantly for 13
        # minutes with 'Costmap timed out waiting for update'. A silent auxiliary sensor must not
        # stop the robot; the lidar layer keeps its own staleness check.
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.5
        clear_on_max_reading: True
        input_sensor_type: ALL
      tof_left_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/tof/left"]
        # The VL53L1X cone really is 0.47 rad (27 deg). At 1.2 the layer painted a 69 deg arc,
        # so one chair leg at 0.5 m became a 0.6 m wall — the ToF layer's own version of a
        # costmap that is too puffy. Model the sensor, then let the inflation layer do inflation.
        phi: 0.47
        # The whole cone: the sensor cannot say where across its 27 degrees the object was, so the
        # honest mark is the whole arc at that range (0.19 m wide at 0.4 m, about four cells).
        inflate_cone: 1.0
        # 0 = never declare the costmap stale because of the ToF: the layer's 'current' flag stayed
        # false after one timeout (the boot-time clock jump) and every goal died instantly for 13
        # minutes with 'Costmap timed out waiting for update'. A silent auxiliary sensor must not
        # stop the robot; the lidar layer keeps its own staleness check.
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.5
        clear_on_max_reading: True
        input_sensor_type: ALL
      tof_right_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/tof/right"]
        # The VL53L1X cone really is 0.47 rad (27 deg). At 1.2 the layer painted a 69 deg arc,
        # so one chair leg at 0.5 m became a 0.6 m wall — the ToF layer's own version of a
        # costmap that is too puffy. Model the sensor, then let the inflation layer do inflation.
        phi: 0.47
        # The whole cone: the sensor cannot say where across its 27 degrees the object was, so the
        # honest mark is the whole arc at that range (0.19 m wide at 0.4 m, about four cells).
        inflate_cone: 1.0
        # 0 = never declare the costmap stale because of the ToF: the layer's 'current' flag stayed
        # false after one timeout (the boot-time clock jump) and every goal died instantly for 13
        # minutes with 'Costmap timed out waiting for update'. A silent auxiliary sensor must not
        # stop the robot; the lidar layer keeps its own staleness check.
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.5
        clear_on_max_reading: True
        input_sensor_type: ALL
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # steep: cost falls off fast beyond the hull
        inflation_radius: 0.35  # a flat, not a warehouse: 0.45 made every doorway a wall
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.10
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # On False the full grid is published only when its origin moves, so a robot standing still
      # publishes nothing but incremental updates — exactly when a stall needs looking at, and the
      # reason no costmap ever appeared in Foxglove. 3600 cells at 1 Hz costs nothing.
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5
      publish_frequency: 0.5
      transform_tolerance: 1.0
      global_frame: map
      robot_base_frame: base_link
      # The true polygon, NOT a 0.30 m disc. The disc was tried on 2026-09-08 to stop NavFn
      # routing the centre of a 0.55 m cart past a chair leg, and it made the cart unplannable
      # wherever it parks: every cell within 0.30 m of anything becomes impassable, the START
      # cell included, so "Failed to create plan" fired four times in a row next to the sofa and
      # the tree answered with a reverse. Clearance is bought with cost below, never with a band
      # the planner cannot enter — a robot must always be able to plan its way out of where it
      # already stands.
      footprint: "[[0.0625, 0.275], [0.0625, -0.275], [-0.30, -0.275], [-0.30, 0.275]]"
      # 0.0, deliberately, and this is what lets the cart touch furniture. Nav2's DEFAULT
      # footprint_padding is 0.01, and it was silently in force: /local_costmap/published_footprint
      # measured 0.5700 x 0.3825 with an inscribed radius of 0.0725 m, i.e. a centimetre of phantom
      # hull in front of a bumper that is only 0.0625 m ahead of base_link. That phantom is the
      # polygon every collision check uses, so a pose with the bumper against a table read as a
      # collision — the timidity was a padding default, not caution.
      footprint_padding: 0.0
      resolution: 0.05
      # false: a cell the survey never covered counts as FLOOR, not as a void. The map does not
      # cover every corner of the flat — in run 0042, 227 of 327 tracked poses stood on cells with
      # no data — and with unknown tracked as NO_INFORMATION the planner alternately refused to
      # move and needed allow_unknown to route at all, while the tree filled the confusion with
      # recoveries. The map is a fixed input; what is actually in front of the cart comes from the
      # lidar's own obstacle layer at 10 Hz and from the ToF, both of which mark into this costmap
      # in real time. So unsurveyed ground is driven on sensor evidence instead of being feared.
      track_unknown_space: false
      # The ToF are in here too, not just in the local costmap: a plan is what routes around an
      # obstacle, and a sensor whose returns never reach the planner can only ever stop the robot.
      plugins: ["static_layer", "obstacle_layer", "tof_front_layer", "tof_left_layer", "tof_right_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.10
      tof_front_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/tof/front"]
        phi: 0.47
        # The whole cone, not a third of it: a VL53L1X reports one distance and cannot say where
        # across its 27 degrees the object was, so the honest mark is the whole arc at that range
        # (0.19 m wide at 0.4 m — about four cells). A one-cell mark is what the planner kept
        # squeezing past.
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.5
        clear_on_max_reading: True
        input_sensor_type: ALL
      tof_left_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/tof/left"]
        phi: 0.47
        # The whole cone, not a third of it: a VL53L1X reports one distance and cannot say where
        # across its 27 degrees the object was, so the honest mark is the whole arc at that range
        # (0.19 m wide at 0.4 m — about four cells). A one-cell mark is what the planner kept
        # squeezing past.
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.5
        clear_on_max_reading: True
        input_sensor_type: ALL
      tof_right_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/tof/right"]
        phi: 0.47
        # The whole cone, not a third of it: a VL53L1X reports one distance and cannot say where
        # across its 27 degrees the object was, so the honest mark is the whole arc at that range
        # (0.19 m wide at 0.4 m — about four cells). A one-cell mark is what the planner kept
        # squeezing past.
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.5
        clear_on_max_reading: True
        input_sensor_type: ALL
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wide and shallow, and this is the planner's whole clearance mechanism: an obstacle keeps
        # a high price out to half a metre (cost 167 at 0.20 m, 157 at 0.30 m, 118 at 0.50 m
        # against 0 for free space), and NavFn pays 50 + 0.8*cost per cell, so it will route three
        # times as far around a chair leg rather than shave it — yet it can always squeeze through
        # when there is no other way. A pillar with soft edges, not a wall.
        # Back to the local costmap's numbers. At 0.55 m / 2.0 a cell half a metre from a wall
        # still carried cost 98, and NavFn pays COST_NEUTRAL + 0.8 * cost for it — 128 against 50
        # for free space — so every route in the flat bent away from every wall. That is the
        # wandering; the gradient should die where the hull's own clearance ends.
        # 0.55 / 2.0, and these two numbers are not a preference — they are the only pair
        # measured to work. Bisected live on 2026-09-08: at 0.45 / 5.0 the lattice planner
        # answered "no valid path found" to every one of the four marks in 20-40 ms, and putting
        # exactly these back made all four succeed again. They also clear Smac's own requirement
        # that the inflation reach the circumscribed radius (0.407 m), without which it refuses
        # its potential-field shortcut and says so at startup. NavFn pays for the gentler
        # gradient by bending away from walls; NavFn is the fallback, not the daily driver.
        cost_scaling_factor: 2.0
        inflation_radius: 0.55
      # False: the map is 239x215 cells, so publishing it whole at 0.5 Hz spends 50 kB/s on a
      # board whose control loop already drops to 3 Hz. Turn it on when a refused plan needs
      # looking at. The local one stays on — 3600 cells is genuinely free.
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    # Two planners, chosen at run time through /planner_selector (ros/go.sh planner ...).
    # GridBased is the baseline: NavFn, a grid search that returns a polyline with no notion of
    # which way the cart faces. Lattice is the experiment: Smac's state lattice walking real
    # motion primitives for a DIFFERENTIAL drive — it can turn in place and it can reverse, so a
    # plan may legally start by backing out of a corner, which is the manoeuvre this stack has
    # never been able to express.
    planner_plugins: ["GridBased", "Lattice", "ThetaStar", "Smac2D"]
    costmap_update_timeout: 2.5  # the global costmap updates at 0.5 Hz; 1.0 timed out every plan
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # 0.25, and the reasoning is the opposite of what it looks like. A mark stands against
      # furniture, so its own cell is inside the inflation's inscribed band and NavFn — which
      # treats that band as impassable — cannot route to it at all: at 0.05 it answered "Failed
      # to create plan with tolerance of 0.050000" for every mark in the flat. It needs room to
      # re-target a reachable cell nearby. Arriving exactly at the furniture is not this
      # planner's job and cannot be made so; it belongs to an approach behaviour that creeps the
      # last centimetres on the ToF, which is the honest way to serve the manipulator.
      tolerance: 0.25
      use_astar: false
      # true, like the lattice. The cart was found standing on a cell the survey never covered
      # (map value 205, walls two cells away) after a drive into a corner, and with this false
      # EVERY planner refuses from there — "Failed to create plan" to all four marks — so the
      # robot is stranded by a gap in its own map. A cell nobody looked at is not a wall, and
      # driving back into surveyed ground is exactly what it must be able to do.
      allow_unknown: true
    Lattice:
      # These numbers are the ones from the first lattice drive, the one that worked. Everything
      # tuned on top of them over the following two hours made it worse, and the audit says why:
      # the analytic expansion, which writes most of a short route, scores on length and cost
      # alone — reverse_penalty, rotation_penalty and non_straight_penalty never reach it. So the
      # penalties below are the nav2 defaults and stay that way; the shape of a lattice plan is
      # changed by the control set, not by tuning.
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      # The control set nav2 ships for a differential drive at our own costmap resolution.
      lattice_filepath: "/opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      # true: a cell nobody has ever observed is not a wall, and with false a footprint touching
      # one unmapped cell made the pose unplannable.
      allow_unknown: true
      tolerance: 0.30
      max_iterations: 200000
      max_on_approach_iterations: 500
      max_planning_time: 3.0  # four A53 cores: a plan that takes longer is not worth having
      # The analytic expansion is Reeds-Shepp — a car model that prices a metre in reverse like a
      # metre forward and charges none of the penalties below — and it is attempted from the START
      # node. At 2.0 m it wrote the whole route: run 0045 planned "reverse 2.95 m of 3.01 m" to a
      # printer that lies astern of home. Half a metre lets it do the one thing it is good at,
      # the final heading alignment at the mark, and leaves the route to the primitive search,
      # which has in-place rotations and does pay reverse_penalty. Attempted every 8th expansion
      # instead of every 3.5th, because a short one fails more often and each try costs.
      analytic_expansion_ratio: 8.0
      analytic_expansion_max_length: 0.5
      # 4.0 now that it counts: with the analytic expansion confined to half a metre the
      # primitive search writes the route, and this is the price of a metre in reverse there.
      # Run 0047 still planned an 0.87 m reverse leg at 2.5; the search must find turning round
      # cheaper than that.
      reverse_penalty: 4.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      rotation_penalty: 5.0  # a turn in place is cheap for this cart but slow for the clock
      cost_penalty: 2.0  # keep away from the inflation, the same instinct as the cost above
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      # The obstacle heuristic is a full Dijkstra over the costmap and the goal barely moves
      # during a drive: cached, the same route planned in 151-194 ms instead of 542.
      cache_obstacle_heuristic: true
      allow_reverse_expansion: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2
    ThetaStar:
      # Any-angle search: a path of long straight segments instead of NavFn's grid-hugging
      # polyline, which is what a cart that turns in place actually wants — turn, then drive
      # straight. Robot as a point (the controller keeps the true shape), start cell never
      # refused, cost of a NavFn plan.
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.0
      allow_unknown: true
      use_final_approach_orientation: false
    Smac2D:
      # Smac's grid variant: A* over cells with the costmap's cost in the metric and a smoother
      # after — the robot as a point, so it turns in place like NavFn and Theta* and never refuses
      # a start. Here so the whole Smac family can be compared on the same drive, not by hearsay.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      # No backup_speed here: BackUp takes its speed from the action goal, so this key was inert.
      # The tree's own BackUp nodes carry the speed (0.05-0.15) that the rear casters can take.
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    # map, not odom: BackUp/DriveOnHeading measure their distance in this frame; in odom a slipping
    # wheel 'completed' every manoeuvre without the robot moving (58 recoveries, 2026-09-07 12:18).
    local_frame: map
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    # 2.0 s of simulated motion means a Spin is judged over 65 deg of yaw — the full 0.407 m swing
    # circle — so every Spin beside the printer exited "Collision Ahead" without turning a wheel
    # (6 of 8 on 2026-09-08). One second judges 32 deg, which is a manoeuvre the cart can finish.
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.25
    rotational_acc_lim: 1.0  # ...1.5 overshoots its heading and the next tick corrects it

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 0.6]
    min_velocity: [-0.075, 0.0, -0.6]
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.6, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    # NOT LAUNCHED, on purpose (nav.launch.py). A "stop" polygon fed by the ToF was tried on
    # 2026-09-08 and it walls the cart in: parked 0.05 m from the printer the sensors see it, the
    # monitor zeroes every command, and the robot cannot even begin to leave (run 0009: 75
    # recoveries, distance stuck at 2.56 m). A short-range sensor has to be evidence the planner
    # routes around, not a veto on the wheels — see the ToF layers in both costmaps.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.10
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
