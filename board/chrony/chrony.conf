# /etc/chrony/chrony.conf on the board. Installed by board/chrony.sh from the repo's
# board/chrony/chrony.conf; edit it there, never on the board.
#
# ONE CLOCK FOR THE ROBOT. Every ROS stamp on the laptop is the Docker VM's clock, every stamp
# here is this board's, and scans, transforms and maps cross between the two. So this board
# follows the laptop's time server (the pepin-chrony container, which serves the VM's clock) and
# keeps the internet pool beside it: the fallback when the laptop is away, and a vote against a
# laptop whose clock is wrong.
#
# The laptop's server is NOT in this file: board/chrony.sh writes it to
# /etc/chrony/sources.d/pepin-laptop.sources from /etc/default/pepin-ros (PEPIN_TIME_SOURCE,
# PEPIN_LAPTOP_HOST), so the switch and a new laptop address are a `chronyc reload sources`, not a
# restart. PEPIN_TIME_SOURCE=pool deletes that file and this board runs on the pool alone.
sourcedir /etc/chrony/sources.d

# The fallback, and the only source when the laptop is away or PEPIN_TIME_SOURCE=pool: the servers
# systemd-timesyncd used on this board. Three of them, so that with the laptop there are four
# voters and one wrong clock is outvoted. After a Mac sleep the Docker VM's clock is behind by the
# length of the sleep until Docker Desktop steps it again 10-26 s after the wake (measured
# 2026-09-23: +26, +10, +22 and +19 s); a laptop sample from that window is minutes off, and the
# pool marks it a falseticker instead of this board slewing towards it. `prefer` on the laptop
# (never `trust`) keeps it the one followed whenever it agrees with them.
pool 2.debian.pool.ntp.org iburst maxsources 3

# Step the clock at BOOT only (the first three updates): the board has no battery for its RTC and
# boots on the time it was switched off at, hours or days behind (2026-09-07 11:45: a 13.75 h NTP
# jump under a running Nav2 killed the first goal). After that the clock is only ever slewed, so
# a running stack never sees time jump. pepin-ros.service waits for the first update
# (NTPSynchronized, which systemd reads from the kernel's maxerror — chrony sets it when it is
# synchronised), so the stack starts after the step, never across it.
makestep 1 3

# The frequency learned, kept across reboots: a board driving alone (no laptop, no internet)
# keeps correcting its crystal by it and drifts milliseconds an hour instead of seconds.
driftfile /var/lib/chrony/chrony.drift

# Debian's defaults, kept: a source whose frequency estimate is this uncertain does not move the
# clock (the laptop's first minutes after a wake included), and the kernel copies the time to
# the RTC every 11 minutes.
maxupdateskew 100.0
rtcsync
logdir /var/log/chrony
