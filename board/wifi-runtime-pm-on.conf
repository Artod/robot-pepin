# Drop-in for wifi-powersave-off.service: /etc/systemd/system/wifi-powersave-off.service.d/runtime-pm-on.conf
#
# `iw ... set power_save off` is not the whole story on the Zero 3: the wifi device's
# runtime power management (sysfs power/control = auto) lets it autosuspend between
# packets, which shows up as 300-600 ms latency spikes on an otherwise -40 dBm link.
[Service]
ExecStartPost=/bin/sh -c "echo on > /sys/class/net/wlan0/device/power/control"
