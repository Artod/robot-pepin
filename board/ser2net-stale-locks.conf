# Drop-in for ser2net.service: /etc/systemd/system/ser2net.service.d/stale-locks.conf
#
# /var/lock lives on the SD card on this image, so UUCP lock files survive an
# unclean shutdown. ser2net then refuses to open the serial port ("Error accessing
# locks in /var/lock: File exists", or "Port in use by pid N" when the pid was reused
# by ser2net itself) and closes every TCP client at once. ser2net.yaml now disables
# the locks altogether (nouucplock); this sweep covers both file styles anyway:
# LCK..ttyACM0 (by name) and LCK.166.000 (by device number).
[Service]
ExecStartPre=-/bin/sh -c "rm -f /var/lock/LCK.*"
