; Pepin's head: ideaspark ESP32-WROOM board, 16 MB flash, 1.9" ST7789 170x320, CH340 USB-UART.
;
;   uvx --from platformio pio run                  build
;   uvx --from platformio pio run -t upload        build and flash over the CH340 (/dev/cu.usbserial-*)
;   uvx --from platformio pio test -e native       the renderer and the protocol on this computer

[env:head]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 921600
build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
