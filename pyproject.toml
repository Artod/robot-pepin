[project]
name = "pepin"
version = "0.1.0"
description = "Mobile home robot: a differential-drive IKEA cart with a 6-DoF arm, lidar, and a phone for a face"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech]>=0.6.0",
    "numpy>=1.26",
    "rerun-sdk>=0.37.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]
macos = [
    "rumps>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepin"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "hardware: needs the live robot (run with --hardware)",
    "slow: seconds, not milliseconds — simulated drives; not in the pre-commit hook (uv run pytest -m slow)",
]

[tool.mypy]
python_version = "3.12"
# The ROS nodes are type-checked too: a node that referenced a field deleted in a refactor
# only failed on the robot (2026-09-08), and mypy sees that without rclpy being installed.
files = ["src/pepin", "ros/pepin_bringup/pepin_bringup", "ros/tools"]
strict = true
ignore_missing_imports = true

# The ROS nodes are glue over an untyped rclpy: check them for real mistakes (a field that no
# longer exists, a wrong assignment) without demanding generics on every ROS type.
[[tool.mypy.overrides]]
module = [
    "pepin_bringup.*",
    "base_bridge",
    "bench_global_search",
    "call",
    "draw_snapshot",
    "goto_ros",
    "load_map",
    "npz_to_map",
    "relocalizer",
    "scan_latency",
    "session_logger",
    "snapshot_ros",
    "tof_bridge",
    "topic_rate",
    "yaw_check",
]
disallow_subclassing_any = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_untyped_defs = false
