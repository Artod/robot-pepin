[project]
name = "pepin"
version = "0.1.0"
description = "Mobile home robot: a differential-drive IKEA cart with a 6-DoF arm, lidar, and a phone for a face"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech]>=0.6.0",
    "mcap>=1.5.0",
    "numpy>=1.26",
    "rerun-sdk>=0.37.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]
macos = [
    "pygame>=2.6.1",
    "rumps>=0.4.0",
]
# The depth network on the laptop's GPU (pepin.depth_service, ros/depth_host.sh): torch comes
# with the base install (lerobot), transformers only here — the unit tier never imports it.
depth = [
    "transformers>=4.50",
]
# The localisation models on the laptop's GPU (pepin.localization_service, ros/models.sh): XFeat
# and LighterGlue (LighterGlue runs on kornia's LightGlue, pinned to the version the
# pepin-laptop:xfeat image carries, ros/Dockerfile.xfeat) and BoQ from torch.hub's cache; torch and
# torchvision come with the base install.
localization = [
    "kornia==0.8.3",
]
# The LLM's tools (pepin.tools): the MCP server that Claude Code / Claude Desktop start
# (`uv run python -m pepin.tools.mcp`) and the Anthropic SDK of the test loop. Synced by default
# on the laptop (below); the board never installs from this file.
llm = [
    "anthropic>=1.9.0",
    "google-genai>=1.0",
    "mcp>=2.2.0",
    "openai>=1.60",
]
# The voice loops' local ears and voice: Whisper on the Mac's GPU (pepin.voice_live.wake.MlxWhisper),
# Qwen3-TTS through mlx-audio, Praat's prosody through parselmouth and the Smart Turn end-of-turn
# model through onnxruntime (pepin.voice_cascade). MLX is Apple silicon only; the unit tier never
# imports any of them.
voice = [
    "mlx-audio[tts]==0.5.8 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "onnxruntime>=1.20",
    "praat-parselmouth>=0.4.7",
]
# The cascade's other speech-to-text engines (pepin.voice_cascade.stt; transcriber.engine, or
# `scripts/voice_cascade.py switch --transcriber NAME` while it runs): not installed by default,
# one `uv sync --group stt-<engine>` each. GigaAM and Canary run on onnxruntime's CPU through
# onnx-asr; Parakeet and Voxtral on the GPU through mlx-audio, whose `stt` extra is all they add
# to the voice group. Weights land in the Hugging Face cache at the first load.
stt-gigaam = ["onnx-asr[cpu,hub]==0.12.0"]
stt-canary = ["onnx-asr[cpu,hub]==0.12.0"]
stt-parakeet = ["mlx-audio[stt]==0.5.8 ; platform_machine == 'arm64' and sys_platform == 'darwin'"]
stt-voxtral = ["mlx-audio[stt]==0.5.8 ; platform_machine == 'arm64' and sys_platform == 'darwin'"]
# The face sensor on the laptop (pepin.face_sensor, scripts/face_sensor.py): SCRFD + ArcFace through
# onnxruntime (its macOS wheel carries the CoreML provider) and MediaPipe's Face Landmarker; the
# EmotiEffLib expression net is its ONNX file run by onnxruntime (the emotiefflib package reads
# weights only from ~/.emotiefflib). Pinned to the versions measured together; the unit tier never
# imports them.
face = [
    "insightface==2.1",
    "mediapipe==1.1.0",
    "onnxruntime==1.30.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepin"]

# `uv sync` and `uv run` install these groups unasked: the laptop is where both run, and the
# menu-bar app (rumps) and the game-mode teleop (pygame) must not die on a missing import. The
# board never installs from this file (board/README.md: src/pepin is rsynced).
[tool.uv]
default-groups = ["dev", "macos", "llm", "voice"]
# OpenCV comes once, as lerobot's opencv-python-headless: insightface asks for opencv-python and
# mediapipe for opencv-contrib-python, and the three wheels write the same cv2 package over each
# other. Neither calls anything the headless build lacks (the face group runs on it, 2026-10-08).
override-dependencies = [
    "opencv-python ; sys_platform == 'never'",
    "opencv-contrib-python ; sys_platform == 'never'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Vendored third-party source is not this project's code: it is upstream's, verbatim but for the
# import rewrites its __init__ lists, and a diff against upstream is the only readable thing
# about it. Reformatting it would destroy that.
extend-exclude = ["src/pepin/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "hardware: needs the live robot (run with --hardware)",
    "weights: loads real model weights, gigabytes on the GPU (run with --weights)",
    "slow: over 0.3 s — simulated drives, sockets, timeouts, subprocesses (uv run pytest -m \"not slow\" skips them)",
    "serial: asserts on wall-clock time, flaky under parallel load; the pre-push hook runs these alone, after the parallel run",
]

# The pre-push floor (.githooks/pre-push, --cov=src/pepin) measures this project's code: the
# vendored upstream source is excluded here as it is from ruff and mypy.
[tool.coverage.run]
omit = ["src/pepin/vendor/*"]

[tool.mypy]
python_version = "3.12"
# The ROS nodes are type-checked too: a node that referenced a field deleted in a refactor
# only failed on the robot (2026-09-08), and mypy sees that without rclpy being installed.
files = [
    "src/pepin",
    "ros/pepin_bringup/pepin_bringup",
    "ros/tools",
    "ros/xfeat",
    "ros/replay",
    "ros/sim",
    "scripts/timesync.py",
    "scripts/extrinsics.py",
    "scripts/voice_live.py",
    "scripts/voice_cascade.py",
    "scripts/barge_in_eval.py",
    "scripts/face_sensor.py",
    "apps/macos",
]
strict = true
ignore_missing_imports = true
# a launch file is launch_ros glue, as those of ros/pepin_bringup/launch (not checked either)
exclude = ["^src/pepin/vendor/", "^ros/sim/.*\\.launch\\.py$"]

# The ROS nodes are glue over an untyped rclpy: check them for real mistakes (a field that no
# longer exists, a wrong assignment) without demanding generics on every ROS type.
[[tool.mypy.overrides]]
module = [
    "pepin_bringup.*",
    "bag_to_tape",
    "export_world",
    "goto_ros",
    "npz_to_map",
    "score",
    "session_logger",
    "sim_world",
    "topic_rate",
]
disallow_subclassing_any = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_untyped_defs = false

# The menu-bar app subclasses rumps.App, which has no stubs (Any); the rest of it is strict.
[[tool.mypy.overrides]]
module = "tray"
disallow_subclassing_any = false

# Vendored upstream source (src/pepin/vendor): untyped by nature, excluded above, and skipped
# on import too so a strict call into it is Any rather than an untyped-call error. Judging it
# would mean editing it, and the point of vendoring is that it is not edited.
[[tool.mypy.overrides]]
module = "pepin.vendor.*"
follow_imports = "skip"
ignore_errors = true

# transformers is the optional `depth` group: with it installed its untyped from_pretrained
# needs a `type: ignore[no-untyped-call]`, without it the import is Any and the same comment
# reads as unused. The module is checked as strictly as the rest; only that warning is off.
[[tool.mypy.overrides]]
module = "pepin.depth_service"
warn_unused_ignores = false
