[project]
name = "pepin"
version = "0.1.0"
description = "Mobile home robot: a differential-drive IKEA cart with a 6-DoF arm, lidar, and a phone for a face"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech]>=0.6.0",
    "numpy>=1.26",
    "rerun-sdk>=0.37.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]
macos = [
    "rumps>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepin"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["hardware: needs the live robot (run with --hardware)"]

[tool.mypy]
python_version = "3.12"
files = ["src/pepin"]
strict = true
ignore_missing_imports = true
